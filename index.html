<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Workout PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4ff00">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root { --accent: #d4ff00; --bg: #0a0a0a; --card: #151515; }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg); padding: 20px; box-sizing: border-box; position: relative; }
    h2 { font-size: 24px; text-align: center; color: var(--accent); margin: 30px 0; }
    
    .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #666; margin-bottom: 10px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .day { 
      background: var(--card); min-height: 65px; display: flex; flex-direction: column; 
      align-items: center; justify-content: flex-start; padding-top: 10px;
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; border: 2px solid transparent;
    }
    .day:hover { background: #333; }
    .day.empty { background: transparent; cursor: default; border: none; }
    .day.today { border: 2px solid var(--accent); color: var(--accent); }

    .record-badge {
      display: flex; justify-content: center; align-items: center; text-align: center;      
      font-size: 10px; background: var(--accent); color: #000; padding: 4px 0; 
      border-radius: 4px; margin-top: 5px; width: 85%; box-sizing: border-box; font-weight: bold;
      word-break: break-word; white-space: normal; line-height: 1.2;
    }

    .btn { width: 100%; padding: 20px; background: var(--card); border: 1px solid #333; color: #fff; border-radius: 12px; margin-bottom: 15px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.start-btn { background: var(--accent); color: #000; margin-top: 20px; border: none; }
    .btn.abort-btn { margin-top: 20px; border: 1px solid #ff4444; color: #ff4444; background: transparent; }
    .btn.abort-btn:hover { background: #ff4444; color: #fff; }

    .config-section { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #222; }
    .config-title { font-size: 14px; color: var(--accent); margin-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
    .set-row { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap; gap: 10px;}
    .set-row span { font-size: 15px; font-weight: bold; }
    .set-input { width: 60px; padding: 8px; font-size: 16px; text-align: center; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; font-weight: bold; }
    
    .action-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .action-row .btn { margin-bottom: 0; padding: 15px; font-size: 16px; }

    .display { text-align: center; margin: 80px 0; }
    .label { font-size: 20px; color: #888; margin-bottom: 10px; }
    .main-val { font-size: 64px; font-weight: 800; color: var(--accent); }
    .sub-val { font-size: 28px; margin-top: 10px; opacity: 0.8; }

    .view { display: none; } .active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <div id="view-cal" class="view active">
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 30px 0;">
      <button class="btn" style="width: auto; margin: 0; padding: 10px 15px; background: transparent; border: 1px solid #333;" onclick="changeMonth(-1)">◀</button>
      <h2 id="calendar-title" style="margin: 0;">년 월</h2>
      <button class="btn" style="width: auto; margin: 0; padding: 10px 15px; background: transparent; border: 1px solid #333;" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="cal-header"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div id="calendar-grid" class="calendar"></div>
  </div>

  <div id="view-select" class="view">
    <h2 id="select-title">운동 종목 선택</h2>
    
    <div id="existing-records-section" style="display: none; background: #111; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #222;">
      <h3 style="margin-top: 0; font-size: 14px; color: var(--accent); margin-bottom: 10px;">완료된 기록</h3>
      <div id="existing-records-list"></div>
    </div>

    <div id="exercise-list"></div>
    <button class="btn" style="opacity: 0.5; margin-top: 20px;" onclick="showView('view-cal')">달력으로 돌아가기</button>
  </div>

  <div id="view-config" class="view">
    <h2 id="config-title">루틴 설정</h2>
    
    <div class="config-section">
      <div class="config-title">타이머 설정</div>
      <div class="set-row">
        <span>준비 시간</span>
        <div><input type="number" id="input-prep" class="set-input" min="1"><span> 초</span></div>
      </div>
      <div class="set-row">
        <span>세트 간 휴식</span>
        <div><input type="number" id="input-rest" class="set-input" min="0"><span> 초</span></div>
      </div>
      <div class="set-row" id="speed-config-row">
        <span style="font-size: 14px;">동작 간격 (초)</span>
        <div><input type="number" step="0.1" id="input-speed" class="set-input" min="0.1"><span> 초</span></div>
      </div>
    </div>

    <div class="config-section">
      <div class="config-title">
        세트 및 상세 설정
        <button style="background:transparent; border:none; color:#ff4444; font-size:12px; cursor:pointer;" onclick="deleteExercise()">🗑️ 운동 삭제</button>
      </div>
      <div id="config-sets-container"></div>
      <div class="action-row" style="margin-top: 15px;">
        <button class="btn" onclick="addSet()">+ 세트 추가</button>
        <button class="btn" style="background: #333; border-color: #555; color: #ccc;" onclick="removeSet()">- 세트 삭제</button>
      </div>
    </div>

    <button class="btn start-btn" onclick="saveAndStart()">💾 저장 및 운동 시작</button>
    <button class="btn abort-btn" onclick="showView('view-select')">취소</button>
  </div>

  <div id="view-timer" class="view">
    <h2 id="ex-name">운동 이름</h2>
    <div class="display">
      <div id="ex-label" class="label">준비하세요</div>
      <div id="ex-main" class="main-val">--</div>
      <div id="ex-sub" class="sub-val"></div>
    </div>
    
    <button id="btn-run" class="btn start-btn" onclick="startEngine()">▶️ 시작하기</button>
    <button id="btn-force-complete" class="btn" style="display: none; background: #28a745; border: none; margin-top: 10px; color: #fff;" onclick="forceComplete()">✅ 즉시 완료로 표시</button>
    <button id="btn-abort" class="btn abort-btn" style="display: none;" onclick="abortWorkout()">🛑 중단하기</button>
    
    <div id="action-buttons" style="display: none;">
      <button class="btn" style="background: #007bff; border: none; margin-top: 30px;" onclick="goToCalendar()">달력으로 돌아가기</button>
    </div>
  </div>
</div>

<div id="modal-add-ex" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:var(--card); padding:20px; border-radius:12px; width:90%; max-width:350px; text-align:center; border:1px solid #333;">
      <h3 style="margin-top:0; color:var(--accent);">새 운동 추가</h3>
      <input type="text" id="new-ex-name" placeholder="운동 이름 (예: 덤벨 프레스)" style="width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box; background:#000; color:#fff; border:1px solid #555; border-radius:8px; font-size:16px;">
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
        <button class="btn" style="padding:15px 5px; margin:0; font-size:14px;" onclick="submitNewExercise('reps')">🔄 맨몸 횟수</button>
        <button class="btn" style="padding:15px 5px; margin:0; font-size:14px; background:#222; border-color:#444;" onclick="submitNewExercise('time')">⏱️ 시간 버티기</button>
        <button class="btn" style="padding:15px 5px; margin:0; font-size:14px; background:#222; border-color:#444;" onclick="submitNewExercise('weight')">🏋️ 중량 운동</button>
        <button class="btn" style="padding:15px 5px; margin:0; font-size:14px; background:#222; border-color:#444;" onclick="submitNewExercise('cardio')">🏃 유산소(머신)</button>
      </div>
      <button class="btn abort-btn" style="margin-top:10px; padding:10px;" onclick="closeAddModal()">취소</button>
    </div>
</div>

<div id="modal-edit-record" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
  <div style="background:var(--card); padding:20px; border-radius:12px; width:95%; max-width:400px; border:1px solid #333; max-height: 85vh; overflow-y: auto;">
    <h3 style="margin-top:0; color:var(--accent); text-align:center;">기록 상세 및 수정</h3>
    
    <div style="margin-bottom: 15px;">
      <label style="font-size: 12px; color: #888;">운동 이름</label>
      <input type="text" id="edit-rec-name" style="width:100%; padding:10px; margin-top:5px; box-sizing:border-box; background:#000; color:#fff; border:1px solid #555; border-radius:8px; font-size:16px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="font-size: 12px; color: #888;">수행한 세트 정보</label>
      <div id="edit-rec-sets-container" style="margin-top:10px;"></div>
      <div style="display:flex; gap:5px; margin-top:15px;">
        <button class="btn" style="padding:10px; margin:0; font-size:14px;" onclick="addEditRecSet()">+ 세트 추가</button>
        <button class="btn" style="padding:10px; margin:0; font-size:14px; background:#333; border-color:#555;" onclick="removeEditRecSet()">- 세트 삭제</button>
      </div>
    </div>

    <button class="btn start-btn" style="margin-top:10px;" onclick="saveRecordEdit()">💾 기록 업데이트</button>
    <button class="btn abort-btn" style="margin-top:10px; padding:15px;" onclick="closeEditRecordModal()">닫기</button>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      }).catch(err => console.log('SW 등록 실패:', err));

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { window.location.reload(); refreshing = true; }
      });
    });
  }

  let userConfig = JSON.parse(localStorage.getItem('userWorkoutConfig'));
  if (!userConfig || Object.keys(userConfig).length === 0) {
    userConfig = {
      '푸쉬업': { type: 'reps', prep: 4, sets: [45, 30, 25], rest: 30, speed: 1000 }, 
      '플랭크': { type: 'time', prep: 4, sets: [60], rest: 30 },
      '덤벨 프레스': { type: 'weight', prep: 4, sets: [{weight: 15, reps: 12}], rest: 60, speed: 1500 },
      '트레드밀': { type: 'cardio', prep: 10, sets: [{time: 1200, speed: 6.5, incline: 3}], rest: 0 }
    };
    localStorage.setItem('userWorkoutConfig', JSON.stringify(userConfig));
  }
  
  // 하위 호환성 (구버전 데이터 마이그레이션)
  for (let key in userConfig) {
    if (!userConfig[key].type) userConfig[key].type = 'reps';
  }

  const todayDateObj = new Date();
  let currentYear = todayDateObj.getFullYear();
  let currentMonth = todayDateObj.getMonth(); 
  const todayDay = todayDateObj.getDate();

  let selectedDateKey = ''; 
  let selectedDayNumber = null;
  let currentEx = '';
  let audioCtx = null;
  let activeInterval = null;
  let tempoInterval = null;
  let isCancelled = false;
  let resolveCurrentPromise = null;
  let wakeLock = null;

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) { console.error('Wake Lock 실패:', err); }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().then(() => { wakeLock = null; });
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.getElementById('view-timer').classList.contains('active')) {
      if (document.getElementById('ex-label').innerText !== "🎉 완료") requestWakeLock();
    }
  });

  let currentEditRecordIndex = null;
  let currentEditRecordData = null;

  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function buildCalendar() {
    document.getElementById('calendar-title').innerText = `${currentYear}년 ${currentMonth + 1}월`;
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = ''; 
    
    const startDay = new Date(currentYear, currentMonth, 1).getDay(); 
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
    let history = JSON.parse(localStorage.getItem('workoutData')) || {};

    for (let i = 0; i < startDay; i++) {
      let el = document.createElement('div'); el.className = 'day empty'; grid.appendChild(el);
    }
    
    const isRealThisMonth = (currentYear === todayDateObj.getFullYear() && currentMonth === todayDateObj.getMonth());

    for (let i = 1; i <= totalDays; i++) {
      let el = document.createElement('div'); 
      el.className = 'day'; el.innerText = i;
      if (isRealThisMonth && i === todayDay) el.classList.add('today');

      const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

      if (history[dateKey] && history[dateKey].length > 0) {
        let counts = {};
        history[dateKey].forEach(ex => { 
          let exName = typeof ex === 'string' ? ex : ex.name;
          counts[exName] = (counts[exName] || 0) + 1; 
        });
        for (let exName in counts) {
          let badgeText = counts[exName] > 1 ? `${exName} x${counts[exName]}` : exName;
          let badge = document.createElement('div'); 
          badge.className = 'record-badge'; badge.innerText = badgeText; el.appendChild(badge);
        }
      }
      
      el.onclick = () => { 
        selectedDayNumber = i; selectedDateKey = dateKey;
        document.getElementById('select-title').innerText = `${currentMonth + 1}월 ${i}일 운동`; 
        renderExistingRecords(); renderExerciseList(); showView('view-select'); 
      };
      grid.appendChild(el);
    }
  }
  buildCalendar();

  function renderExistingRecords() {
    let history = JSON.parse(localStorage.getItem('workoutData')) || {};
    let todayRecords = history[selectedDateKey] || [];
    const section = document.getElementById('existing-records-section');
    const list = document.getElementById('existing-records-list');

    if (todayRecords.length > 0) {
      section.style.display = 'block';
      list.innerHTML = '';
      todayRecords.forEach((item, idx) => {
        let exName = typeof item === 'string' ? item : item.name;
        let summaryHtml = "";
        
        if (typeof item === 'object' && item.details && item.details.sets) {
          let typeStr = "회";
          if (item.details.type === 'time') typeStr = "초";
          else if (item.details.type === 'cardio') typeStr = "분";
          summaryHtml = `<div style="font-size: 11px; color: #888; margin-top: 4px;">총 ${item.details.sets.length}세트 진행</div>`;
        }

        list.innerHTML += `
          <div style="display: flex; justify-content: space-between; align-items: center; background: #222; padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; cursor: pointer;" onclick="openEditRecordModal(${idx})">
            <div>
              <span style="font-weight: bold; color: var(--accent);">${exName}</span>
              ${summaryHtml}
            </div>
            <div>
              <button style="background: transparent; border: none; color: #4dabf7; cursor: pointer; margin-right: 10px; padding: 5px;" onclick="event.stopPropagation(); openEditRecordModal(${idx})">상세</button>
              <button style="background: transparent; border: none; color: #ff4444; cursor: pointer; padding: 5px;" onclick="event.stopPropagation(); deleteRecord(${idx})">삭제</button>
            </div>
          </div>
        `;
      });
    } else { section.style.display = 'none'; }
  }

  function openEditRecordModal(idx) {
    let history = JSON.parse(localStorage.getItem('workoutData')) || {};
    let record = history[selectedDateKey][idx];
    currentEditRecordIndex = idx;
    
    if (typeof record === 'string') {
      currentEditRecordData = {
        name: record,
        details: userConfig[record] ? JSON.parse(JSON.stringify(userConfig[record])) : { type: 'reps', sets: [10] }
      };
    } else {
      currentEditRecordData = JSON.parse(JSON.stringify(record));
    }

    document.getElementById('edit-rec-name').value = currentEditRecordData.name;
    renderEditRecSets();
    document.getElementById('modal-edit-record').style.display = 'flex';
  }

  function closeEditRecordModal() {
    document.getElementById('modal-edit-record').style.display = 'none';
    currentEditRecordIndex = null; currentEditRecordData = null;
  }

  function renderEditRecSets() {
    const container = document.getElementById('edit-rec-sets-container');
    container.innerHTML = '';
    let sets = currentEditRecordData.details.sets;
    let type = currentEditRecordData.details.type;

    sets.forEach((val, idx) => {
      let html = `
        <div style="display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; flex-wrap:wrap; gap:5px;">
          <span style="font-size: 14px; font-weight: bold;">${idx + 1}세트</span>
          <div style="display:flex; gap:5px; align-items:center;">
      `;

      if (type === 'weight') {
        html += `<input type="number" class="edit-rec-w" value="${val.weight}" step="0.5" style="width: 50px; padding: 4px; font-size: 14px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;"><span>kg</span>
                 <input type="number" class="edit-rec-r" value="${val.reps}" style="width: 40px; padding: 4px; font-size: 14px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;"><span>회</span>`;
      } else if (type === 'cardio') {
        html += `<input type="number" class="edit-rec-time" value="${Math.floor(val.time/60)}" style="width: 40px; padding: 4px; font-size: 14px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;"><span>분</span>
                 <input type="number" class="edit-rec-spd" value="${val.speed}" step="0.1" style="width: 40px; padding: 4px; font-size: 14px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;"><span>속도</span>
                 <input type="number" class="edit-rec-inc" value="${val.incline}" style="width: 35px; padding: 4px; font-size: 14px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;"><span>경사</span>`;
      } else {
        let unit = type === 'time' ? '초' : '회';
        html += `<input type="number" class="edit-rec-basic" value="${val}" min="1" style="width: 50px; padding: 4px; font-size: 14px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;"><span>${unit}</span>`;
      }
      html += `</div></div>`;
      container.innerHTML += html;
    });
  }

  function addEditRecSet() {
    let type = currentEditRecordData.details.type;
    if(type === 'weight') currentEditRecordData.details.sets.push({weight: 10, reps: 10});
    else if(type === 'cardio') currentEditRecordData.details.sets.push({time: 600, speed: 6.0, incline: 0});
    else if(type === 'time') currentEditRecordData.details.sets.push(60);
    else currentEditRecordData.details.sets.push(10);
    renderEditRecSets();
  }

  function removeEditRecSet() {
    if (currentEditRecordData.details.sets.length > 1) {
      currentEditRecordData.details.sets.pop(); renderEditRecSets();
    } else { alert("최소 1개의 세트는 존재해야 합니다."); }
  }

  function saveRecordEdit() {
    let newName = document.getElementById('edit-rec-name').value.trim();
    if (!newName) { alert("운동 이름을 입력해주세요."); return; }
    currentEditRecordData.name = newName;
    
    let type = currentEditRecordData.details.type;
    let newSets = [];
    const rows = document.getElementById('edit-rec-sets-container').children;

    for (let row of rows) {
      if (type === 'weight') {
        newSets.push({
          weight: parseFloat(row.querySelector('.edit-rec-w').value) || 0,
          reps: parseInt(row.querySelector('.edit-rec-r').value) || 1
        });
      } else if (type === 'cardio') {
        let t = parseInt(row.querySelector('.edit-rec-time').value) || 10;
        newSets.push({
          time: t * 60,
          speed: parseFloat(row.querySelector('.edit-rec-spd').value) || 6.0,
          incline: parseInt(row.querySelector('.edit-rec-inc').value) || 0
        });
      } else {
        newSets.push(parseInt(row.querySelector('.edit-rec-basic').value) || 1);
      }
    }
    currentEditRecordData.details.sets = newSets;

    let history = JSON.parse(localStorage.getItem('workoutData')) || {};
    history[selectedDateKey][currentEditRecordIndex] = currentEditRecordData;
    localStorage.setItem('workoutData', JSON.stringify(history));

    closeEditRecordModal(); renderExistingRecords(); buildCalendar();
  }

  function deleteRecord(idx) {
    if (confirm("이 기록을 완전히 삭제하시겠습니까?")) {
      let history = JSON.parse(localStorage.getItem('workoutData')) || {};
      if (history[selectedDateKey]) {
        history[selectedDateKey].splice(idx, 1);
        if (history[selectedDateKey].length === 0) delete history[selectedDateKey];
        localStorage.setItem('workoutData', JSON.stringify(history));
        renderExistingRecords(); buildCalendar();
      }
    }
  }

  function renderExerciseList() {
    const list = document.getElementById('exercise-list');
    list.innerHTML = '';
    for (let exName in userConfig) {
      list.innerHTML += `<button class="btn" onclick="openConfig('${exName}')">${exName}</button>`;
    }
    list.innerHTML += `<button class="btn" style="border: 1px dashed var(--accent); color: var(--accent); background: transparent;" onclick="addNewExercise()">+ 새 운동 추가</button>`;
  }

  function addNewExercise() {
    document.getElementById('new-ex-name').value = ''; 
    document.getElementById('modal-add-ex').style.display = 'flex'; 
  } 
  function closeAddModal() { document.getElementById('modal-add-ex').style.display = 'none'; }
  
  function submitNewExercise(type) {
    let name = document.getElementById('new-ex-name').value.trim();
    if (!name) { alert("운동 이름을 입력해주세요!"); return; }
    if (userConfig[name]) { alert("이미 존재하는 운동입니다."); return; }
    
    if (type === 'reps') userConfig[name] = { type: 'reps', prep: 4, sets: [10], rest: 30, speed: 1000 };
    else if (type === 'time') userConfig[name] = { type: 'time', prep: 4, sets: [60], rest: 30 };
    else if (type === 'weight') userConfig[name] = { type: 'weight', prep: 4, sets: [{ weight: 10, reps: 10 }], rest: 60, speed: 1500 };
    else if (type === 'cardio') userConfig[name] = { type: 'cardio', prep: 10, sets: [{ time: 600, speed: 6.0, incline: 0 }], rest: 0 };
    
    localStorage.setItem('userWorkoutConfig', JSON.stringify(userConfig));
    closeAddModal(); renderExerciseList(); 
  }
  
  function deleteExercise() {
    if (confirm(`정말 '${currentEx}' 종목을 삭제하시겠습니까?`)) {
      delete userConfig[currentEx];
      localStorage.setItem('userWorkoutConfig', JSON.stringify(userConfig));
      renderExerciseList(); showView('view-select');
    }
  }

  function openConfig(name) {
    currentEx = name;
    document.getElementById('config-title').innerText = `${name} 루틴 설정`;
    document.getElementById('input-prep').value = userConfig[name].prep;
    document.getElementById('input-rest').value = userConfig[name].rest;
    
    const speedRow = document.getElementById('speed-config-row');
    if (userConfig[name].type === 'time' || userConfig[name].type === 'cardio') {
      speedRow.style.display = 'none';
    } else {
      speedRow.style.display = 'flex';
      document.getElementById('input-speed').value = (userConfig[name].speed / 1000).toFixed(1);
    }
    showView('view-config'); renderSets();
  }

  function renderSets() {
    const container = document.getElementById('config-sets-container');
    container.innerHTML = '';
    const ex = userConfig[currentEx];
    const sets = ex.sets;

    sets.forEach((val, index) => {
      let rowHtml = `<div class="set-row"><span>${index + 1}세트</span><div style="display: flex; gap: 6px; align-items:center;">`;
      
      if (ex.type === 'weight') {
        rowHtml += `
          <input type="number" class="set-input weight-input" value="${val.weight || 0}" step="0.5" style="width:55px;"><span>kg</span>
          <input type="number" class="set-input reps-input" value="${val.reps || 10}" style="width:45px;"><span>회</span>
        `;
      } else if (ex.type === 'cardio') {
        rowHtml += `
          <input type="number" class="set-input time-input" value="${Math.floor((val.time || 600)/60)}" style="width:40px;"><span>분</span>
          <input type="number" class="set-input speed-input" value="${val.speed || 6.0}" step="0.1" style="width:45px;"><span>속도</span>
          <input type="number" class="set-input incline-input" value="${val.incline || 0}" style="width:35px;"><span>경사</span>
        `;
      } else {
        let unit = ex.type === 'time' ? '초' : '회'; 
        rowHtml += `<input type="number" class="set-input basic-input" value="${val}" min="1" style="width:60px;"><span> ${unit}</span>`;
      }
      
      rowHtml += `</div></div>`;
      container.innerHTML += rowHtml;
    });
  }
  
  function addSet() { 
    const type = userConfig[currentEx].type;
    if (type === 'weight') userConfig[currentEx].sets.push({weight: 10, reps: 10});
    else if (type === 'cardio') userConfig[currentEx].sets.push({time: 600, speed: 6.0, incline: 0});
    else if (type === 'time') userConfig[currentEx].sets.push(60);
    else userConfig[currentEx].sets.push(10);
    renderSets(); 
  }

  function removeSet() {
    if (userConfig[currentEx].sets.length > 1) { userConfig[currentEx].sets.pop(); renderSets(); } 
    else alert("최소 1개의 세트는 존재해야 합니다.");
  }

  function saveAndStart() {
    userConfig[currentEx].prep = parseInt(document.getElementById('input-prep').value) || 4; 
    userConfig[currentEx].rest = parseInt(document.getElementById('input-rest').value) || 0; 
    
    if (userConfig[currentEx].type === 'reps' || userConfig[currentEx].type === 'weight') {
      let speedSec = parseFloat(document.getElementById('input-speed').value) || 1.0;
      userConfig[currentEx].speed = speedSec * 1000; 
    }

    const rows = document.querySelectorAll('.set-row:not(#speed-config-row)');
    let newSets = [];
    
    // config-section 내부의 진짜 set-row만 선택하기 위해 container 안에서만 찾음
    const setRows = document.getElementById('config-sets-container').querySelectorAll('.set-row');
    
    setRows.forEach(row => {
      if (userConfig[currentEx].type === 'weight') {
        let w = parseFloat(row.querySelector('.weight-input').value) || 0;
        let r = parseInt(row.querySelector('.reps-input').value) || 1;
        newSets.push({ weight: w, reps: r });
      } else if (userConfig[currentEx].type === 'cardio') {
        let t = parseInt(row.querySelector('.time-input').value) || 10;
        let s = parseFloat(row.querySelector('.speed-input').value) || 6.0;
        let i = parseInt(row.querySelector('.incline-input').value) || 0;
        newSets.push({ time: t * 60, speed: s, incline: i }); 
      } else {
        let val = parseInt(row.querySelector('.basic-input').value) || 1;
        newSets.push(val);
      }
    });
    
    userConfig[currentEx].sets = newSets;
    localStorage.setItem('userWorkoutConfig', JSON.stringify(userConfig));
    initTimerView();
  }

  function play(f, d) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d);
  }

  function initTimerView() {
    isCancelled = false; 
    document.getElementById('ex-name').innerText = `${currentMonth + 1}월 ${selectedDayNumber}일 - ${currentEx}`;
    document.getElementById('ex-label').innerText = "준비";
    document.getElementById('ex-main').innerText = userConfig[currentEx].prep;
    document.getElementById('ex-sub').innerText = "시작을 누르면 카운트가 시작됩니다";
    
    document.getElementById('btn-run').style.display = 'block'; 
    document.getElementById('btn-abort').style.display = 'none';
    document.getElementById('btn-force-complete').style.display = 'none'; 
    document.getElementById('action-buttons').style.display = 'none';
    showView('view-timer');
    requestWakeLock();
  }

  async function startEngine() {
    if (audioCtx?.state === 'suspended') audioCtx.resume();
    document.getElementById('btn-run').style.display = 'none'; 
    document.getElementById('btn-abort').style.display = 'block'; 
    document.getElementById('btn-force-complete').style.display = 'block'; 
    
    const cfg = userConfig[currentEx]; 
    
    await countdown("준비", cfg.prep, cfg.speed, cfg.type);
    if(isCancelled) return;

    for (let i = 0; i < cfg.sets.length; i++) {
      await performSet(i + 1, cfg.sets[i], cfg.speed, cfg.type);
      if(isCancelled) return;
      if (i < cfg.sets.length - 1 && cfg.rest > 0) {
        await countdown(`휴식 (${i+1}세트 완료)`, cfg.rest, cfg.speed, cfg.type);
        if(isCancelled) return;
      }
    }
    if(!isCancelled) finishWorkout();
  }

  function abortWorkout() {
    isCancelled = true;
    if (activeInterval) clearInterval(activeInterval); 
    if (tempoInterval) { clearInterval(tempoInterval); tempoInterval = null; }
    if (resolveCurrentPromise) resolveCurrentPromise();
    showView('view-cal');
    releaseWakeLock();
  }

  function forceComplete() {
    isCancelled = true; 
    if (activeInterval) clearInterval(activeInterval);
    if (tempoInterval) { clearInterval(tempoInterval); tempoInterval = null; }
    if (resolveCurrentPromise) resolveCurrentPromise();
    finishWorkout(); 
  }

  function countdown(label, seconds, speed, type) {
    return new Promise(resolve => {
      resolveCurrentPromise = resolve;
      let count = seconds;
      document.getElementById('ex-label').innerText = label;
      document.getElementById('ex-sub').innerText = "";
      document.getElementById('ex-main').innerText = count;

      let phase = 0;

      if(count <= 0) { resolve(); return; }

      function handleTick() {
        if (type === 'reps' || type === 'weight') {
          if (count <= 4 && count > 0) {
            if (!tempoInterval) {
               play(300, 0.15); phase = 1;
               tempoInterval = setInterval(() => {
                 if(isCancelled) { clearInterval(tempoInterval); tempoInterval = null; return; }
                 if (phase === 0) { play(300, 0.15); phase = 1; }
                 else { play(600, 0.15); phase = 0; }
               }, speed);
            }
          } else if (count === 0) {
            if (activeInterval) clearInterval(activeInterval);
            if (tempoInterval) { clearInterval(tempoInterval); tempoInterval = null; }
            play(880, 0.4); setTimeout(resolve, 1000);
          }
        } else { 
          if (count <= 5 && count > 0) play(440, 0.2);
          else if (count === 0) {
            if (activeInterval) clearInterval(activeInterval);
            if (tempoInterval) { clearInterval(tempoInterval); tempoInterval = null; }
            play(880, 0.4); setTimeout(resolve, 1000);
          }
        }
      }

      handleTick();

      activeInterval = setInterval(() => {
        if(isCancelled) {
          if (activeInterval) clearInterval(activeInterval);
          if (tempoInterval) { clearInterval(tempoInterval); tempoInterval = null; }
          return;
        }
        count--;
        if(count >= 0) {
          document.getElementById('ex-main').innerText = count;
          handleTick();
        }
      }, 1000);
    });
  }

  function performSet(setNum, setConfig, speed, type) {
    return new Promise(resolve => {
      resolveCurrentPromise = resolve;
      document.getElementById('ex-label').innerText = `${setNum}세트 진행 중`;
      
      if (type === 'cardio') {
        let timeLeft = setConfig.time;
        document.getElementById('ex-main').innerText = `${Math.floor(timeLeft / 60)}:${String(timeLeft % 60).padStart(2, '0')}`;
        document.getElementById('ex-sub').innerText = `속도: ${setConfig.speed} / 경사도: ${setConfig.incline}`;
        play(440, 0.3); 
        
        activeInterval = setInterval(() => {
          if(isCancelled) { clearInterval(activeInterval); return; }
          timeLeft--;
          
          let min = Math.floor(timeLeft / 60);
          let sec = String(timeLeft % 60).padStart(2, '0');
          document.getElementById('ex-main').innerText = `${min}:${sec}`;
          
          if (timeLeft <= 5 && timeLeft > 0) play(440, 0.2); 
          else if (timeLeft === 0) {
            play(880, 0.5); clearInterval(activeInterval); setTimeout(resolve, 1000);
          }
        }, 1000);

      } else if (type === 'time') {
        let timeLeft = setConfig;
        document.getElementById('ex-main').innerText = timeLeft;
        document.getElementById('ex-sub').innerText = "🔥 끝까지 버티세요!";
        play(440, 0.3); 
        
        activeInterval = setInterval(() => {
          if(isCancelled) { clearInterval(activeInterval); return; }
          timeLeft--;
          document.getElementById('ex-main').innerText = timeLeft;
          
          if (timeLeft <= 5 && timeLeft > 0) play(440, 0.2); 
          else if (timeLeft === 0) {
            play(880, 0.5); clearInterval(activeInterval); setTimeout(resolve, 1000);
          }
        }, 1000);
        
      } else if (type === 'weight') {
        let currentRep = 1; let phase = 0; 
        let totalReps = setConfig.reps;
        document.getElementById('ex-main').innerText = `${currentRep} / ${totalReps}`;
        document.getElementById('ex-sub').innerText = `목표 중량: ${setConfig.weight}kg`;
        play(300, 0.15); phase = 1;
        
        activeInterval = setInterval(() => {
          if(isCancelled) { clearInterval(activeInterval); return; }
          document.getElementById('ex-main').innerText = `${currentRep} / ${totalReps}`;
          
          if (phase === 0) { play(300, 0.15); phase = 1; } 
          else {
            play(600, 0.15); 
            if (currentRep >= totalReps) { clearInterval(activeInterval); setTimeout(resolve, speed); } 
            else { currentRep++; phase = 0; }
          }
        }, speed);

      } else {
        // 기존 reps
        let currentRep = 1; let phase = 0; 
        let totalReps = setConfig;
        document.getElementById('ex-main').innerText = `${currentRep} / ${totalReps}`;
        document.getElementById('ex-sub').innerText = "⬇️ 내려가기";
        play(300, 0.15); phase = 1;
        
        activeInterval = setInterval(() => {
          if(isCancelled) { clearInterval(activeInterval); return; }
          document.getElementById('ex-main').innerText = `${currentRep} / ${totalReps}`;
          document.getElementById('ex-sub').innerText = phase === 0 ? "⬇️ 내려가기" : "⬆️ 올라오기";
          
          if (phase === 0) { play(300, 0.15); phase = 1; } 
          else {
            play(600, 0.15); 
            if (currentRep >= totalReps) { clearInterval(activeInterval); setTimeout(resolve, speed); } 
            else { currentRep++; phase = 0; }
          }
        }, speed);
      }
    });
  }

  function finishWorkout() {
    document.getElementById('btn-abort').style.display = 'none';
    document.getElementById('btn-force-complete').style.display = 'none'; 
    document.getElementById('ex-label').innerText = "🎉 완료"; 
    document.getElementById('ex-main').innerText = "오운완!"; 
    document.getElementById('ex-sub').innerText = "정말 수고하셨습니다";
    document.getElementById('action-buttons').style.display = 'block';
    releaseWakeLock();

    let history = JSON.parse(localStorage.getItem('workoutData')) || {};
    if (!history[selectedDateKey]) history[selectedDateKey] = [];
    
    history[selectedDateKey].push({
      name: currentEx,
      details: JSON.parse(JSON.stringify(userConfig[currentEx]))
    });
    
    localStorage.setItem('workoutData', JSON.stringify(history));
  }

  function goToCalendar() { buildCalendar(); showView('view-cal'); }
  
  function changeMonth(offset) {
    currentMonth += offset;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; } 
    else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    buildCalendar();
  }
</script>
